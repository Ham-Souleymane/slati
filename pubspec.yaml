name: slati
description: " Slati for prayer times, and community posts."
publish_to: "none"
version: 1.0.0+8

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── Firebase ─────────────────────────────────────────────────
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  firebase_storage: ^13.4.3
  firebase_messaging: ^16.4.1

  # ── Google Sign-In & Apple Sign-In ───────────────────────────
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0

  # ── State Management ─────────────────────────────────────────
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # ── Navigation ───────────────────────────────────────────────
  go_router: ^17.3.0

  # ── Fonts & UI ───────────────────────────────────────────────
  google_fonts: ^8.1.0
  intl: ^0.20.2

  # ── Utilities ────────────────────────────────────────────────
  shared_preferences: ^2.3.2
  lottie: ^3.1.2
  flutter_svg: ^2.0.10+1
  crypto: ^3.0.3
  geolocator: ^14.0.3

  geocoding: ^4.0.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  country_picker: ^2.0.27

  cupertino_icons: ^1.0.8
  permission_handler: ^12.0.3
  url_launcher: ^6.3.2
  http: ^1.2.2
  flutter_local_notifications: ^18.0.0
  timezone: ^0.10.1
  hijri: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  build_runner: ^2.4.12
  riverpod_generator: ^4.0.0+1
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
